name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Forkból érkező PR-nál a secretek nem elérhetők
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Build reviewer
        run: mvn -q -B -f reviewer/pom.xml package

      - name: Compile demo app (output goes to the review)
        run: |
          if [ -f demo-countdown/pom.xml ]; then
            mvn -q -B -f demo-countdown/pom.xml test-compile > compile.log 2>&1 || true
          fi

      - name: Run AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMPILE_LOG: compile.log
          REPORT_FILE: target/review/latest.md
        run: java -jar reviewer/target/ai-reviewer.jar

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: target/review/latest.md
          if-no-files-found: ignore
